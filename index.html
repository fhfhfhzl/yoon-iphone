<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>YOON's iPhone · Fan Simulation</title><style>*{box-sizing:border-box}body{margin:0;background:#20242d;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;display:grid;place-items:center;min-height:100vh;color:#171717}.phone{width:min(390px,100vw);height:min(820px,100dvh);border:9px solid #111;border-radius:49px;overflow:hidden;position:relative;background:#f5f5fa;box-shadow:0 20px 70px #0007}.status{height:49px;padding:15px 28px 0;display:flex;justify-content:space-between;position:relative;z-index:5;font-weight:650;font-size:13px}.island{position:absolute;width:105px;height:28px;background:#101014;border-radius:30px;top:9px;left:50%;transform:translateX(-50%)}.screen{height:calc(100% - 73px);overflow:auto}.home{height:100%;padding:55px 18px 25px;background:linear-gradient(145deg,#7495b1bb,#ddd6cb77),url('thor.jpg') center/cover,#8aa8bc}.clock{text-align:center;color:white;text-shadow:0 1px 7px #333;font-size:52px;font-weight:200}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 9px;margin-top:65px}.app{text-align:center;color:white;font-size:11px;text-shadow:0 1px 3px #555;cursor:pointer}.ico{width:57px;height:57px;border-radius:15px;display:grid;place-items:center;margin:0 auto 5px;background:#fff;color:#222;font-size:27px;font-weight:700;box-shadow:0 2px 8px #0002}.dock{display:flex;justify-content:space-around;background:#ffffff70;border-radius:22px;padding:12px;margin-top:45px}.dock .ico{margin:0}.nav{height:24px;display:grid;place-items:center;position:absolute;bottom:0;left:0;right:0;background:inherit;cursor:pointer}.bar{width:115px;height:5px;background:#222;border-radius:8px}.head{padding:14px 19px;display:flex;justify-content:space-between;align-items:center;background:white;position:sticky;top:0;z-index:3}.head b{font-size:20px}.back{border:0;background:none;font-size:17px;color:#3478f6;cursor:pointer}.content{padding:16px}.search{width:100%;padding:13px;border:0;border-radius:12px;background:#e9e9ef;font-size:15px}.item{padding:16px 4px;border-bottom:1px solid #ddd;cursor:pointer}.muted{color:#7b7b84;font-size:12px}.bubble{padding:12px;border-radius:16px;background:#fff;max-width:82%;margin:12px 0}.chat{background:#b9c8d5;min-height:100%;padding:15px}.chat .mine{margin-left:auto;background:#fee500}.chat small{display:block;color:#555}.send{display:flex;gap:5px;padding:12px;background:white;position:sticky;bottom:0}.send input{flex:1;min-width:0;padding:11px;border:1px solid #ddd;border-radius:12px}.send button,.pill{border:0;background:#fee500;border-radius:12px;padding:10px;cursor:pointer}.post{background:white;margin-bottom:12px;border-radius:12px;overflow:hidden}.post p{padding:12px;margin:0}.post img{width:100%;display:block}.placeholder{height:190px;background:#e5e7ed;display:grid;place-items:center;color:#888;text-align:center}.yt{display:block;text-decoration:none;color:inherit;background:white;border-radius:13px;padding:17px;margin:12px 0}.yt span{font-size:28px}.tag{font-size:11px;background:#f1f1f4;padding:5px 8px;border-radius:9px;color:#666}.footer{padding:20px;color:#777;text-align:center;font-size:11px}a{color:#2876da}textarea{width:100%;height:210px;border:0;padding:15px;font:inherit}</style><div class="phone"><div class="status"><span id="time">9:41</span><div class="island"></div><span>●●● ▰</span></div><main class="screen" id="screen"></main><div class="nav" onclick="go('home')"><div class="bar"></div></div></div><script>
const el=document.getElementById('screen');let page='home',search='위너',posts=JSON.parse(localStorage.getItem('yoonposts')||'[]'),chat=JSON.parse(localStorage.getItem('yoonchat')||'[]');const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const names=['강승윤','김진우','이승훈','송민호','유시몬 매니저','유호섭 매니저'];const icons=[['X','𝕏','#111','x'],['Instagram','◎','#df4281','instagram'],['카카오톡','TALK','#fee500','kakao'],['Weverse','♥','#25bda8','weverse'],['YouTube','▶','#f33','youtube'],['캘린더','16','#fff','calendar'],['사진','✿','#a2b6eb','photos'],['메모','▤','#f3c94b','notes']];function header(t){return `<div class="head"><button class="back" onclick="go('home')">‹ 홈</button><b>${t}</b><span style="width:35px"></span></div>`}function go(p){page=p;render()}function render(){if(page==='home'){el.innerHTML=`<div class="home"><div class="clock"><div style="font-size:17px">10월 13일 화요일</div><div id="bigtime">9:41</div></div><div class="apps">${icons.map(([n,s,c,p])=>`<div class="app" onclick="go('${p}')"><div class="ico" style="background:${c};color:${n==='카카오톡'?'#222':'white'}">${s}</div>${n}</div>`).join('')}</div><div class="dock">${[['☏','#4c5','phone'],['♫','#f58','youtube'],['▤','#e8b847','notes'],['⚙','#888','settings']].map(([s,c,p])=>`<div class="ico" style="background:${c};color:white" onclick="go('${p}')">${s}</div>`).join('')}</div><p style="text-align:center;color:white;font-size:11px;margin-top:20px">FAN-MADE FICTIONAL PHONE</p></div>`;return}if(page==='x'){el.innerHTML=header('𝕏 검색')+`<div class="content"><input class="search" id="q" value="${safe(search)}" placeholder="X 검색어"><div class="item" onclick="xsearch('위너')">⌕ 위너 <span class="muted">최근 검색</span></div><div class="item" onclick="xsearch('강승윤')">⌕ 강승윤 <span class="muted">최근 검색</span></div><div class="item" onclick="openX()">↗ X에서 검색 결과 열기</div><p class="muted">실시간 게시물은 X 원본 사이트에서 확인합니다.</p></div>`;return}if(page==='youtube'){el.innerHTML=header('YouTube')+`<div class="content"><input class="search" id="ytq" placeholder="YouTube 검색" onkeydown="if(event.key==='Enter')ytsearch()"><button class="pill" onclick="ytsearch()" style="margin-top:8px">검색하기</button>${[['🎵','강승윤 음악 듣기','강승윤 노래'],['🎵','WINNER 음악 듣기','WINNER music'],['👻','심야괴담회 보기','심야괴담회'],['▶','강승윤 공식 채널','https://www.youtube.com/@w_n_r00']].map(([i,t,q])=>`<a class="yt" target="_blank" rel="noopener" href="${q.startsWith('https')?q:'https://www.youtube.com/results?search_query='+encodeURIComponent(q)}"><span>${i}</span> &nbsp; ${t} ↗</a>`).join('')}<p class="muted">유튜브에서 실제 영상과 음악을 재생합니다. 영상에 따라 외부 앱이 열릴 수 있습니다.</p></div>`;return}if(page==='kakao'){el.innerHTML=header('카카오톡')+`<div class="chat"><b>WINNER + 매니저 (6)</b><p class="muted">${names.join(' · ')}</p><p class="tag">팬메이드 가상 채팅 · 실제 대화 아님</p><div class="bubble"><small>시스템</small>그룹 채팅방이 만들어졌습니다.</div>${chat.map(m=>`<div class="bubble mine"><small>나 · 시뮬레이션</small>${safe(m)}</div>`).join('')}</div><div class="send"><input id="msg" placeholder="가상 메시지 입력" onkeydown="if(event.key==='Enter')send()"><button onclick="send()">전송</button></div>`;return}if(page==='instagram'||page==='weverse'){el.innerHTML=header(page==='instagram'?'Instagram':'Weverse')+`<div class="content"><p class="tag">사용자 제공 게시물 아카이브 · 공식 앱 아님</p>${posts.filter(p=>p.app===page).map(p=>`<div class="post"><p><b>${safe(p.author)}</b><br><small>${safe(p.date)}</small></p>${p.image?`<img src="${p.image}" alt="게시물 이미지">`:'<div class="placeholder">게시물 사진 업로드 대기</div>'}<p style="white-space:pre-wrap">${safe(p.body)}</p></div>`).join('')||'<div class="placeholder">아직 등록된 게시물이 없어요.<br>원본 사진과 본문을 추가해 주세요.</div>'}<p class="muted">게시물 등록은 소스의 posts 데이터에 추가할 수 있습니다. 실제 비공개 게시물은 가져오지 않습니다.</p></div>`;return}if(page==='calendar'){el.innerHTML=header('캘린더')+`<div class="content"><h2>2026년 10월</h2><div class="item"><b>금요일 · 10월 16일</b><p>🔴 14:00 — 두시탈출 컬투쇼 생방송</p><small class="muted">사용자 지정 시뮬레이션 일정 · 실제 출연 확정 정보 아님</small></div></div>`;return}if(page==='notes'){el.innerHTML=header('메모')+`<textarea id="note" placeholder="메모를 입력하세요" oninput="localStorage.setItem('yoonnote',this.value)">${safe(localStorage.getItem('yoonnote')||'')}</textarea>`;return}if(page==='photos'){el.innerHTML=header('사진')+`<div class="content"><p>토르 사진을 <b>thor.jpg</b>라는 이름으로 index.html과 같은 폴더에 넣으면 홈 화면 배경으로 적용됩니다.</p><div class="placeholder">사진 라이브러리 준비 중</div></div>`;return}el.innerHTML=header(page==='settings'?'설정':'전화')+`<div class="content"><p>추후 확장 예정</p></div>`}function xsearch(s){search=s;render();openX()}function openX(){const q=document.getElementById('q');window.open('https://x.com/search?q='+encodeURIComponent(q?q.value:search)+'&src=typed_query&f=live','_blank','noopener')}function ytsearch(){const q=document.getElementById('ytq').value.trim();if(q)window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(q),'_blank','noopener')}function send(){let i=document.getElementById('msg');if(i.value.trim()){chat.push(i.value.trim());localStorage.setItem('yoonchat',JSON.stringify(chat));render()}}function tick(){const t=new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Seoul'}).format(new Date());document.getElementById('time').textContent=t;const b=document.getElementById('bigtime');if(b)b.textContent=t}render();tick();setInterval(tick,30000);
</script></html>
